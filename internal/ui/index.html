<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>SoundTouch Radio Installer</title>
<style>
:root {
  --bg: #f6f7f9; --card: #ffffff; --text: #16181d; --muted: #4a505c; --border: #c9ced8;
  --accent: #0b5cd5; --accent-text: #ffffff; --ok: #12703a; --warn-bg: #fff4d6; --warn: #6b4a00;
  --err-bg: #fde8e8; --err: #9b1c1c; --focus: #ff9e1b;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121418; --card: #1d2026; --text: #eef0f4; --muted: #b5bbc7; --border: #3a3f4a;
    --accent: #6ea8ff; --accent-text: #0b0d12; --ok: #5fd38d; --warn-bg: #3a2f10; --warn: #ffd772;
    --err-bg: #3d1717; --err: #ff9f9f; --focus: #ffb347;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 42rem; margin: 0 auto; padding: 1.5rem 1rem 4rem; }
h1 { font-size: 1.6rem; margin: .5rem 0 1rem; }
h2 { font-size: 1.25rem; margin: 1.5rem 0 .75rem; }
h1:focus, h2:focus { outline: none; }
p { margin: .5rem 0; }
.muted { color: var(--muted); }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1rem; margin: .75rem 0; }
.card h3 { margin: 0 0 .25rem; font-size: 1.15rem; }
.row { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .75rem; }
button, .button { font: inherit; font-weight: 600; border-radius: 10px; padding: .65rem 1.2rem; cursor: pointer;
  border: 2px solid var(--accent); background: var(--accent); color: var(--accent-text); text-decoration: none;
  display: inline-block; min-height: 44px; }
button.secondary { background: transparent; color: var(--accent); }
button.danger { background: var(--err); border-color: var(--err); color: var(--card); }
button:disabled { opacity: .5; cursor: not-allowed; }
.big { font-size: 1.25rem; padding: 1rem 1.6rem; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
label { display: block; font-weight: 600; margin-bottom: .25rem; }
input[type=text] { font: inherit; width: 100%; max-width: 16rem; padding: .55rem .7rem; border-radius: 8px;
  border: 2px solid var(--border); background: var(--card); color: var(--text); min-height: 44px; }
.note { border-radius: 10px; padding: .75rem 1rem; margin: .5rem 0; }
.warn { background: var(--warn-bg); color: var(--warn); }
.error { background: var(--err-bg); color: var(--err); }
.ok { color: var(--ok); font-weight: 600; }
ol.steps { list-style: none; padding: 0; margin: 1rem 0; }
ol.steps li { display: flex; gap: .75rem; align-items: baseline; padding: .4rem 0; }
.icon { display: inline-block; width: 1.4rem; text-align: center; font-weight: 700; flex: none; }
li[data-state=pending] { color: var(--muted); }
li[data-state=active] { font-weight: 600; }
li[data-state=done] .icon { color: var(--ok); }
li[data-state=failed] .icon, li[data-state=failed] { color: var(--err); }
.spinner { display: inline-block; width: 1rem; height: 1rem; border: 3px solid var(--border);
  border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; vertical-align: -2px; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
code, .path { font-family: ui-monospace, Menlo, Consolas, monospace; word-break: break-all; }
details { margin-top: .5rem; }
pre { white-space: pre-wrap; word-break: break-all; font-size: .85rem; }
</style>
</head>
<body>
<main>
  <h1 id="title" data-i18n="app.title" tabindex="-1">SoundTouch Radio Installer</h1>
  <div id="lost" class="note error" role="alert" hidden data-i18n="app.lost"></div>

  <section id="view-home" hidden>
    <p data-i18n="app.intro"></p>
    <h2 id="home-h" data-i18n="find.title" tabindex="-1"></h2>
    <p id="find-status" role="status" aria-live="polite"></p>
    <div id="speakers"></div>
    <div class="row"><button type="button" id="search" class="secondary" data-i18n="find.again"></button></div>

    <form id="manual" class="card" novalidate>
      <label for="ip" data-i18n="find.manual.label"></label>
      <p id="ip-hint" class="muted" data-i18n="find.manual.hint"></p>
      <div class="row">
        <input type="text" id="ip" inputmode="decimal" autocomplete="off" spellcheck="false"
               aria-describedby="ip-hint ip-error" placeholder="192.168.178.23">
        <button type="submit" id="add" data-i18n="find.manual.button"></button>
      </div>
      <div id="ip-error" class="note error" role="alert" hidden></div>
    </form>
  </section>

  <section id="view-confirm" hidden>
    <h2 id="confirm-h" tabindex="-1"></h2>
    <p data-i18n="un.confirm.text"></p>
    <div class="row">
      <button type="button" id="confirm-yes" class="danger" data-i18n="un.confirm.yes"></button>
      <button type="button" id="confirm-no" class="secondary" data-i18n="un.confirm.no"></button>
    </div>
  </section>

  <section id="view-job" hidden>
    <h2 id="job-h" tabindex="-1"></h2>
    <div id="job-notes">
      <p class="note warn" id="note-firewall" data-i18n="inst.firewall"></p>
      <p class="muted" data-i18n="inst.keepopen"></p>
    </div>
    <ol class="steps" id="steps" aria-live="polite"></ol>
    <div id="job-error" hidden>
      <div class="note error" role="alert">
        <strong data-i18n="err.title"></strong>
        <p id="err-text"></p>
        <p><strong data-i18n="err.next"></strong> <span id="err-next"></span></p>
        <details id="err-details-box"><summary data-i18n="err.details"></summary><pre id="err-detail"></pre></details>
      </div>
      <div class="row">
        <button type="button" id="retry" data-i18n="common.retry"></button>
        <button type="button" class="secondary back" data-i18n="common.back"></button>
      </div>
    </div>
  </section>

  <section id="view-done" hidden>
    <h2 id="done-h" tabindex="-1" class="ok" data-i18n="done.title"></h2>
    <p class="row"><a id="page-link" class="button big" target="_blank" rel="noopener" data-i18n="done.open"></a></p>
    <p id="done-phone"></p>
    <p id="done-notyet" class="note warn" hidden data-i18n="done.notyet"></p>
    <p id="done-notar" class="note warn" hidden data-i18n="done.notar"></p>
    <div class="card">
      <p id="done-backup"></p>
      <p><strong data-i18n="done.private"></strong></p>
    </div>
    <p class="muted" data-i18n="done.close"></p>
    <div class="row">
      <button type="button" class="secondary back" data-i18n="common.back"></button>
      <button type="button" class="secondary quit" data-i18n="done.quit"></button>
    </div>
  </section>

  <section id="view-undone" hidden>
    <h2 id="undone-h" tabindex="-1" data-i18n="un.done.title"></h2>
    <p data-i18n="un.done.text"></p>
    <div class="row">
      <button type="button" class="secondary back" data-i18n="common.back"></button>
      <button type="button" class="secondary quit" data-i18n="done.quit"></button>
    </div>
  </section>

  <section id="view-quit" hidden>
    <h2 id="quit-h" tabindex="-1" data-i18n="done.quitted"></h2>
  </section>
</main>
<script>
"use strict";
let S = {};            // texts
let status = null;     // last /api/status
let confirmIP = null;  // speaker waiting for uninstall confirmation
let currentView = "";
let failures = 0;
let quitted = false;
let lastSpeakers = "";

const $ = (id) => document.getElementById(id);
const t = (key, ...args) => { let s = S[key] || key; for (const a of args) s = s.replace("%s", () => String(a)); return s; };

function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") e.className = v; else if (k === "text") e.textContent = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v);
  }
  for (const k of kids) if (k) e.append(k);
  return e;
}

async function api(path, body) {
  const opt = body === undefined ? {} : {
    method: "POST", headers: { "Content-Type": "application/json", "X-Installer": "1" },
    body: JSON.stringify(body) };
  const r = await fetch(path, opt);
  if (!r.ok) throw new Error(path + ": HTTP " + r.status);
  return r.json();
}

function show(view, focusId) {
  for (const v of ["home", "confirm", "job", "done", "undone", "quit"]) $("view-" + v).hidden = v !== view;
  if (view !== currentView) {
    currentView = view;
    const f = $(focusId);
    if (f && view !== "home") f.focus();
  }
}

function speakerCard(sp) {
  const c = sp.checks || {};
  const notes = [];
  if (!c.firmwareOK) notes.push(el("p", { class: "note error", text: t("pre.firmware", sp.firmware || "?") }));
  if (!c.consoleOK) notes.push(el("p", { class: "note error", text: t("pre.console") }));
  if (c.unpaired) notes.push(el("p", { class: "note warn", text: t("pre.unpaired") }));
  const can = c.firmwareOK && c.consoleOK;
  const name = sp.name || sp.ip;
  const install = el("button", { type: "button", text: t("spk.install"), "aria-label": t("spk.install") + ": " + name,
    onclick: () => start("install", sp.ip) });
  install.disabled = !can;
  const uninstall = el("button", { type: "button", class: "secondary", text: t("spk.uninstall"),
    "aria-label": t("spk.uninstall") + ": " + name, onclick: () => { confirmIP = sp.ip; render(); } });
  uninstall.disabled = !c.consoleOK;
  return el("div", { class: "card" },
    el("h3", { text: name }),
    el("p", { class: "muted", text: [sp.type, t("spk.ip", sp.ip), sp.firmware ? t("spk.firmware", sp.firmware) : ""].filter(Boolean).join(" · ") }),
    ...notes,
    can ? el("p", { class: "ok", text: t("spk.ready") }) : null,
    el("div", { class: "row" }, install, uninstall));
}

function renderHome() {
  const list = $("speakers");
  const sps = status.speakers || [];
  const key = JSON.stringify(sps);
  if (key !== lastSpeakers) { // rebuild only on change, so keyboard focus is kept
    lastSpeakers = key;
    list.replaceChildren(...sps.map(speakerCard));
  }
  const fs = $("find-status");
  if (status.discovering) fs.replaceChildren(el("span", { class: "spinner", "aria-hidden": "true" }), " ", t("find.searching"));
  else if (status.scanned && sps.length === 0) fs.textContent = t("find.none");
  else fs.textContent = "";
  $("search").disabled = status.discovering;
  show("home", "home-h");
}

const icons = { pending: "○", active: "", done: "✓", failed: "✗" };

function renderJob(j) {
  const name = j.name || j.ip;
  $("job-h").textContent = t(j.action === "install" ? "inst.title" : "un.title", name);
  $("job-notes").hidden = j.action !== "install" || j.state === "error";
  $("steps").replaceChildren(...j.steps.map((s) => {
    const icon = el("span", { class: "icon", "aria-hidden": "true", text: icons[s.state] || "" });
    if (s.state === "active") icon.append(el("span", { class: "spinner" }));
    return el("li", { "data-state": s.state }, icon,
      el("span", { text: t("step." + s.id) }), el("span", { class: "sr-only", text: " (" + t("state." + s.state) + ")" }));
  }));
  const e = j.error;
  $("job-error").hidden = !e;
  if (e) {
    $("err-text").textContent = e.text;
    $("err-next").textContent = e.next;
    $("err-detail").textContent = e.detail || "";
    $("err-details-box").hidden = !e.detail;
  }
  show("job", "job-h");
  if (e && document.activeElement === $("job-h")) $("retry").focus();
}

function renderDone(j) {
  if (j.action === "uninstall") { show("undone", "undone-h"); return; }
  const r = j.result || {};
  const link = $("page-link");
  link.href = r.pageURL;
  $("done-phone").textContent = t("done.phone", r.pageURL);
  $("done-backup").replaceChildren(t("done.backup", "").trim(), " ", el("span", { class: "path", text: r.backupDir }));
  $("done-notyet").hidden = !!r.pageUp;
  $("done-notar").hidden = !!r.tarReceived;
  show("done", "done-h");
}

function render() {
  if (quitted) { show("quit", "quit-h"); return; }
  if (!status) return;
  const j = status.job;
  if (j && j.state === "done") return renderDone(j);
  if (j) return renderJob(j);
  if (confirmIP) {
    const sp = (status.speakers || []).find((s) => s.ip === confirmIP) || { ip: confirmIP };
    $("confirm-h").textContent = t("un.confirm.title", sp.name || sp.ip);
    show("confirm", "confirm-h");
    return;
  }
  renderHome();
}

let autoRescans = 0, lastScan = Date.now();
async function poll() {
  try {
    status = await api("/api/status");
    failures = 0;
    $("lost").hidden = true;
    render();
    // Nothing found (e.g. the speaker is still restarting): search again every 10 s for ~3 min.
    const idle = !status.discovering && !(status.speakers || []).length && !(status.job && status.job.state === "running");
    if (status.scanned && idle && autoRescans < 18 && Date.now() - lastScan > 10000) {
      autoRescans++;
      lastScan = Date.now();
      api("/api/discover", {}).catch(() => {});
    }
  } catch (e) {
    if (!quitted && ++failures >= 3) $("lost").hidden = false;
  }
  if (!quitted) setTimeout(poll, status && (status.discovering || (status.job && status.job.state === "running")) ? 1000 : 2000);
}

async function start(action, ip) {
  confirmIP = null;
  try {
    const r = await api("/api/" + action, { ip });
    if (r.error) { alertHome(r.error); return; }
    status = await api("/api/status");
    render();
  } catch (e) { $("lost").hidden = false; }
}

function alertHome(err) {
  const box = $("ip-error");
  box.textContent = err.text + " " + err.next;
  box.hidden = false;
  render();
  box.focus();
}

async function init() {
  try { const r = await api("/api/strings"); S = r.strings; document.documentElement.lang = r.lang; }
  catch (e) { $("lost").hidden = false; return; }
  for (const n of document.querySelectorAll("[data-i18n]")) n.textContent = t(n.dataset.i18n);
  document.title = t("app.title");
  $("ip-error").tabIndex = -1;

  $("search").addEventListener("click", () => api("/api/discover", {}).then(poll0));
  $("manual").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const btn = $("add"), box = $("ip-error");
    box.hidden = true;
    btn.disabled = true; btn.textContent = t("find.checking");
    try {
      const r = await api("/api/add", { ip: $("ip").value });
      if (r.error) { box.textContent = r.error.text + " " + r.error.next; box.hidden = false; $("ip").focus(); }
      else { $("ip").value = ""; status = await api("/api/status"); render(); }
    } catch (e) { $("lost").hidden = false; }
    btn.disabled = false; btn.textContent = t("find.manual.button");
  });
  $("confirm-yes").addEventListener("click", () => start("uninstall", confirmIP));
  $("confirm-no").addEventListener("click", () => { confirmIP = null; render(); $("search").focus(); });
  $("retry").addEventListener("click", () => { const j = status.job; start(j.action, j.ip); });
  for (const b of document.querySelectorAll(".back"))
    b.addEventListener("click", async () => { await api("/api/reset", {}); status = await api("/api/status"); render(); $("home-h").focus(); });
  for (const b of document.querySelectorAll(".quit"))
    b.addEventListener("click", async () => {
      try { const r = await api("/api/quit", {}); if (!r.error) { quitted = true; render(); } } catch (e) {}
    });

  status = await api("/api/status");
  if (status.autoScan && !status.scanned && !status.discovering && !(status.speakers || []).length) {
    await api("/api/discover", {});
  }
  poll();
}
function poll0() { api("/api/status").then((s) => { status = s; render(); }); }
init();
</script>
</body>
</html>

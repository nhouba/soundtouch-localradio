name: installer

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...
      - name: Smoke test of the built installer
        run: |
          go build -o st-installer$([ "$RUNNER_OS" = Windows ] && echo .exe) ./cmd/installer
          ./st-installer --version
          ./st-installer --no-browser --port 18181 > out.txt 2>&1 &
          for i in $(seq 30); do curl -fs http://127.0.0.1:18181/api/status > status.json && break; sleep 1; done
          cat out.txt status.json
          curl -fs http://127.0.0.1:18181/ | grep -q "<html"
          curl -fs http://127.0.0.1:18181/api/strings | grep -q '"app.title"'
          curl -fs -X POST -H 'Content-Type: application/json' -H 'X-Installer: 1' -d '{}' http://127.0.0.1:18181/api/quit
          sleep 2
          ! curl -fs http://127.0.0.1:18181/api/status

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    # macOS runner: the Mac app is made with lipo, codesign and ditto
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          VERSION: ${{ github.ref_name }}
        run: sh build.sh
      - name: Checksums
        run: cd dist && shasum -a 256 SoundTouch-Radio-Installer-* > SHA256SUMS.txt
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
